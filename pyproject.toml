[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costguard-agent"
version = "0.2.0-beta"
description = "CostGuard Free — local-first AI usage intelligence. See your AI usage without giving away your work."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []          # stdlib only; zero network
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# Server-side Split API (P0-04/05/06). Core package stays stdlib-only;
# these extras are only needed to RUN or TEST the HTTP layer.
split-server = ["fastapi>=0.110", "pydantic>=2.5", "httpx>=0.27"]

[project.scripts]
costguard = "costguard_agent.cli:main"

[tool.setuptools.packages.find]
include = ["costguard_agent*"]

[tool.setuptools.package-data]
"costguard_agent.data" = ["*.json"]
