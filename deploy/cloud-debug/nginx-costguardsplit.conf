# Replace the three DEPLOY_* paths during deployment. Never commit their files.
server {
    listen 80;
    listen [::]:80;
    server_name costguardsplit.nuxnow.com;
    return 301 https://costguardsplit.nuxnow.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name costguardsplit.nuxnow.com;

    ssl_certificate     DEPLOY_TLS_CERTIFICATE_PATH;
    ssl_certificate_key DEPLOY_TLS_PRIVATE_KEY_PATH;

    auth_basic "CostGuard Split cloud debug";
    auth_basic_user_file DEPLOY_HTPASSWD_PATH;

    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        expires off;
    }
}